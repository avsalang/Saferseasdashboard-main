<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6B9A"/>
      <stop offset="100%" stop-color="#07334D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9943A"/>
      <stop offset="50%" stop-color="#F0C96A"/>
      <stop offset="100%" stop-color="#C9943A"/>
    </linearGradient>
  </defs>

  <!-- Data arc lines -->
  <path d="M160,310 Q220,180 300,190" stroke="#4ABFDB" stroke-width="1.2" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M420,290 Q370,180 300,190" stroke="#4ABFDB" stroke-width="1.2" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M130,240 Q210,210 300,190" stroke="#2A8FAF" stroke-width="0.8" fill="none" stroke-dasharray="3,4" opacity="0.4"/>
  <path d="M470,240 Q390,210 300,190" stroke="#2A8FAF" stroke-width="0.8" fill="none" stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Hotspot dots -->
  <circle cx="160" cy="310" r="3.5" fill="#F0C96A" opacity="0.9"/>
  <circle cx="420" cy="290" r="3.5" fill="#F0C96A" opacity="0.9"/>
  <circle cx="130" cy="240" r="2.5" fill="#4ABFDB" opacity="0.8"/>
  <circle cx="470" cy="240" r="2.5" fill="#4ABFDB" opacity="0.8"/>
  <circle cx="200" cy="270" r="2" fill="#4ABFDB" opacity="0.6"/>
  <circle cx="380" cy="275" r="2" fill="#4ABFDB" opacity="0.6"/>

  <!-- Shield -->
  <path d="M300,125 L350,145 L350,208 Q350,242 300,258 Q250,242 250,208 L250,145 Z"
        fill="url(#shieldGrad)" stroke="#1A7FAF" stroke-width="1.5"/>
  <path d="M300,133 L343,150 L343,207 Q343,238 300,253 Q257,238 257,207 L257,150 Z"
        fill="none" stroke="#4ABFDB" stroke-width="0.6" opacity="0.4"/>

  <!-- Anchor -->
  <g transform="translate(300,190)">
    <circle cx="0" cy="-25" r="8" fill="none" stroke="#F0C96A" stroke-width="2"/>
    <line x1="0" y1="-17" x2="0" y2="22" stroke="#F0C96A" stroke-width="2.2"/>
    <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#F0C96A" stroke-width="2.2"/>
    <path d="M0,22 Q-16,18 -16,12" stroke="#F0C96A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M0,22 Q16,18 16,12" stroke="#F0C96A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="-16" cy="12" r="2.5" fill="#F0C96A"/>
    <circle cx="16" cy="12" r="2.5" fill="#F0C96A"/>
  </g>

  <!-- Signal arcs -->
  <path d="M292,128 Q300,118 308,128" stroke="#4ABFDB" stroke-width="1.3" fill="none" opacity="0.7"/>
  <path d="M286,123 Q300,108 314,123" stroke="#4ABFDB" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M280,118 Q300,98 320,118" stroke="#4ABFDB" stroke-width="0.7" fill="none" opacity="0.3"/>

  <!-- Wave -->
  <path d="M205,275 Q225,265 245,275 Q265,285 285,275 Q305,265 325,275 Q345,285 365,275 Q385,265 400,275"
        stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M215,283 Q235,273 255,283 Q275,293 295,283 Q315,273 335,283 Q355,293 375,283 Q390,273 400,278"
        stroke="#1A7FAF" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="300" y="316"
        text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif"
        font-size="36"
        font-weight="700"
        letter-spacing="8"
        fill="white">SAFER<tspan fill="url(#goldGrad)">SEAS</tspan></text>

  <!-- Tagline -->
  <text x="300" y="338"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5"
        letter-spacing="3.5"
        fill="#4ABFDB"
        opacity="0.85">MARITIME SAFETY · DATA INTELLIGENCE</text>

  <!-- Gold rule -->
  <rect x="185" y="344" width="230" height="0.8" fill="url(#goldGrad)" opacity="0.5" rx="1"/>

  <!-- Sub-label -->
  <text x="300" y="358"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="7"
        letter-spacing="2.5"
        fill="#4ABFDB"
        opacity="0.5">PHILIPPINE WATERS</text>
</svg>
